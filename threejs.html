<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_1 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_1" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_1');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const scene = new THREE.Scene();
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.z = 24;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Ambient light with neon tint
const ambientLight = new THREE.AmbientLight(0x8b5cf6, 1.2);
scene.add(ambientLight);

// Point lights for electric blue and purple highlights
const purpleLight = new THREE.PointLight(0xa855f7, 3, 50);
purpleLight.position.set(10, 10, 10);
scene.add(purpleLight);

const blueLight = new THREE.PointLight(0x38bdf8, 3.5, 50);
blueLight.position.set(-10, -8, 12);
scene.add(blueLight);

// Floating Group of Abstract Anti-Gravity Geometries
const group = new THREE.Group();
scene.add(group);

// Central Icosahedron Wireframe + Translucent Core
const coreGeo = new THREE.IcosahedronGeometry(4.2, 1);
const coreMat = new THREE.MeshPhongMaterial({
  color: 0x4f46e5,
  emissive: 0x2e1065,
  specular: 0x38bdf8,
  shininess: 90,
  wireframe: true,
  transparent: true,
  opacity: 0.35
});
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
group.add(coreMesh);

// Inner glowing solid crystal
const innerGeo = new THREE.OctahedronGeometry(2.4, 0);
const innerMat = new THREE.MeshPhongMaterial({
  color: 0x9333ea,
  emissive: 0x3b0764,
  specular: 0xc084fc,
  shininess: 100,
  flatShading: true,
  transparent: true,
  opacity: 0.75
});
const innerMesh = new THREE.Mesh(innerGeo, innerMat);
group.add(innerMesh);

// Surrounding orbital floating satellites
const satellites = [];
const satGeo = new THREE.TetrahedronGeometry(0.7, 0);
const satMat = new THREE.MeshPhongMaterial({
  color: 0x06b6d4,
  emissive: 0x083344,
  specular: 0x38bdf8,
  shininess: 80,
  flatShading: true
});

for (let i = 0; i < 18; i++) {
  const mesh = new THREE.Mesh(satGeo, satMat);
  const angle = (i / 18) * Math.PI * 2;
  const radius = 6.5 + Math.sin(i * 1.5) * 2.2;
  const y = (Math.random() - 0.5) * 6;
  mesh.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
  mesh.userData = {
    angle: angle,
    radius: radius,
    speed: 0.006 + Math.random() * 0.008,
    rotSpeedX: Math.random() * 0.02,
    rotSpeedY: Math.random() * 0.02,
    yBase: y,
    yAmp: 0.5 + Math.random() * 0.6,
    seed: Math.random() * 10
  };
  group.add(mesh);
  satellites.push(mesh);
}

// Subtle cosmic dust particles
const particleGeo = new THREE.BufferGeometry();
const particleCount = 140;
const positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i += 3) {
  positions[i] = (Math.random() - 0.5) * 35;
  positions[i + 1] = (Math.random() - 0.5) * 30;
  positions[i + 2] = (Math.random() - 0.5) * 25;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0x38bdf8,
  size: 0.12,
  transparent: true,
  opacity: 0.6
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// Mouse interaction
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

const handleResize = () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
};
window.addEventListener('resize', handleResize);

// Animation loop
let clock = 0;
function animate() {
  requestAnimationFrame(animate);
  clock += 0.015;

  targetX += (mouseX * 0.8 - targetX) * 0.05;
  targetY += (mouseY * 0.8 - targetY) * 0.05;

  group.rotation.x = clock * 0.2 + targetY * 0.5;
  group.rotation.y = clock * 0.25 + targetX * 0.6;
  innerMesh.rotation.y = -clock * 0.4;
  innerMesh.rotation.z = clock * 0.3;

  satellites.forEach((sat) => {
    sat.userData.angle += sat.userData.speed;
    sat.position.x = Math.cos(sat.userData.angle) * sat.userData.radius;
    sat.position.z = Math.sin(sat.userData.angle) * sat.userData.radius;
    sat.position.y = sat.userData.yBase + Math.sin(clock + sat.userData.seed) * sat.userData.yAmp;
    sat.rotation.x += sat.userData.rotSpeedX;
    sat.rotation.y += sat.userData.rotSpeedY;
  });

  particles.rotation.y = clock * 0.04;

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_1 -->
</body>
</html>
